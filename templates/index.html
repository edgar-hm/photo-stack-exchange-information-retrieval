<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Query Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Photography Query Search</h1>
        <form action="/search" method="POST" class="mt-4">
            <div class="mb-3">
                <label for="query" class="form-label">Enter your search query:</label>
                <input type="text" class="form-control" id="query" name="query" placeholder="e.g., Best wide-angle lens for landscapes" required>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>
</body>
</html>
